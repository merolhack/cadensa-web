name: CI & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright Cross-Browser E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E Tests
        run: npx playwright test tests/e2e/cadensa.spec.ts
        env:
          CI: 'true'

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-test-and-deploy:
    name: Build, Verify & Deploy to Cloudflare Pages
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Type Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run Unit and BDD Tests
        run: npm run test:all

      - name: Apply Supabase Migrations
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            npm run db:migrate || echo "::warning::Supabase migration skipped or failed"
          else
            echo "SUPABASE_ACCESS_TOKEN not configured. Skipping migrations."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Check Cloudflare Credentials
        id: cf_check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_cf_secrets=true" >> $GITHUB_OUTPUT
            echo "Cloudflare secrets detected. Proceeding with deployment."
          else
            echo "has_cf_secrets=false" >> $GITHUB_OUTPUT
            echo "Cloudflare secrets not configured. Skipping deployment stage."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf_check.outputs.has_cf_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=cadensa-web

      - name: Setup Python for SEO Notification
        if: steps.cf_check.outputs.has_cf_secrets == 'true' && github.ref == 'refs/heads/main'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SEO Notification Dependencies
        if: steps.cf_check.outputs.has_cf_secrets == 'true' && github.ref == 'refs/heads/main'
        run: |
          pip install cryptography

      - name: Verify Search Console Permissions Setup
        if: steps.cf_check.outputs.has_cf_secrets == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python3 scripts/check_indexing_status.py --verify-setup || echo "⚠️ Advertencia: La notificación a Google fallará hasta que se configuren los permisos en Search Console."
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON || secrets.GCP_SA_METRICS_KEY }}

      - name: Notify Search Engines (Google & Bing SEO)
        if: steps.cf_check.outputs.has_cf_secrets == 'true' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/submit_seo_changes.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON || secrets.GCP_SA_METRICS_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY || secrets.BING_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
