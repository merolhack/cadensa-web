name: Periodic Health & Uptime Audit

on:
  schedule:
    # Corre diariamente a las 06:00 UTC (00:00 CST)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Production Endpoint & Health Probe Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smoke Test Live Endpoints
        env:
          TARGET_HOST: 'https://cadensa-web.pages.dev'
        run: |
          ENDPOINTS=(
            "/"
            "/about"
            "/stats"
            "/privacy"
            "/terms"
            "/tecnicas/sts"
            "/tecnicas/easy_onset"
            "/tecnicas/light_contact"
            "/tecnicas/prolonged_speech"
            "/tecnicas/box_breathing"
            "/tecnicas/pull_out"
            "/tecnicas/cancellation"
            "/sitemap.xml"
            "/robots.txt"
            "/ads.txt"
          )
          FAILURES=0

          echo "🔍 Auditando endpoints core en $TARGET_HOST..."
          for ep in "${ENDPOINTS[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$TARGET_HOST$ep" || echo "000")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "  ✓ $ep -> HTTP $HTTP_CODE (OK)"
            else
              echo "  ❌ $ep -> HTTP $HTTP_CODE (FAILED)"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES endpoint(s) core fallaron en la auditoría de disponibilidad."
            exit 1
          fi
          echo "🎉 Todos los endpoints core respondieron correctamente."

      - name: GitGuardian Security & Secret Leak Posture Audit
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          echo "🛡️ Ejecutando auditoría de seguridad e incidentes de GitGuardian..."
          python3 scripts/audit-gitguardian.py
