name: Weekly Telemetry & Platform Metrics

on:
  schedule:
    # Ejecución automática todos los lunes a las 06:00 UTC (medianoche hora México)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract Platform Metrics (GA4, GSC, Bing, Cloudflare)
        run: npm run metrics:update
        env:
          GCP_SA_METRICS_KEY: ${{ secrets.GCP_SA_METRICS_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit and Push Updated Stats
        run: |
          if [ -n "$(git status --porcelain src/data/platform_stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/platform_stats.json
            git commit -m "chore(telemetry): update weekly platform stats"
            git push origin main
            echo "Estadísticas actualizadas y enviadas a main."
          else
            echo "No se detectaron cambios en las estadísticas. Saltando commit."
          fi
