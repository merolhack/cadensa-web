name: Cadensa CI - Quality & Clinical Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-bdd:
    name: Frontend Unit Tests, BDD & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & TypeScript Type Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run Vitest Unit Tests (Frontend)
        run: npm test

      - name: Run Cucumber BDD Scenarios (Clinical & Domain)
        run: npm run test:bdd

      - name: Verify Next.js Turbopack Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  python-multimedia-ci:
    name: Python Multimedia & Audio Processing Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock numpy scipy opencv-python-headless imageio imageio-ffmpeg

      - name: Run Python Multimedia Unit Tests
        run: |
          python -m pytest tests/python/test_audio_generation.py tests/python/test_batch_catalog_and_widgets.py tests/python/test_video_composition.py -v

